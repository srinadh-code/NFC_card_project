databases:
  - name: nexora-db
    plan: free
    databaseName: nexora
    user: nexora

services:
  - type: web
    name: nexora-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    # No healthCheckPath: every real endpoint under /api/ requires auth or a
    # real resource id, and there's no public "/" or "/health/" route in
    # config/urls.py to point at instead. Render falls back to a plain
    # TCP-port check, which is sufficient here.
    envVars:
      # Secrets / environment-specific — set manually or generated, never
      # committed. Everything else below has a safe, explicit value here so
      # a first deploy doesn't silently fall back to a local-dev default.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: ACCESS_TOKEN_LIFETIME_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      # Optional — leave unset for console-backend email / no persistent
      # media (see .env.example for what each one does).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
